name: Cross-Platform CI

on:
  push:
    branches:
      - main
      - release/upcoming
  pull_request:
    branches:
      - main
      - release/upcoming

jobs:
  test-matrix:
    name: ${{ matrix.os }} (Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build CLI and UI
        run: npm run build

      - name: Run unit, contract, and E2E integration tests
        run: npm test
